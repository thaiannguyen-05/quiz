services:
  db:
    image: postgres:17-alpine
    container_name: quizdeck-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quizdeck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quizdeck}
      POSTGRES_DB: ${POSTGRES_DB:-quizdeck}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - quizdeck-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  quizdeck-postgres:
